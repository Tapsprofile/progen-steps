---
- name: Base OS baseline
  hosts: all
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - jq
          - python3
          - python3-pip
          - chrony
        update_cache: true
        state: present

    - name: Ensure chrony is enabled
      ansible.builtin.service:
        name: chrony
        enabled: true
        state: started

